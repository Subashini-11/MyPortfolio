                  </div>

                  {activeDemo === 'bst-playlist' ? (
                    <div className="demo-container-box">
                      <div className="demo-title-bar">
                        <span style={{ fontWeight: 700, color: 'var(--text-highlight)' }}>BST Playlist Engine &bull; O(log n) Operations</span>
                        <span style={{ fontSize: '0.85rem', color: 'var(--cyan)' }}>Total Tracks: {songs.length}</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.25rem', marginBottom: '1.5rem' }}>
                        <form onSubmit={handleAddSong} style={{ display: 'flex', gap: '0.5rem' }}>
                          <input type="text" className="bst-input" placeholder="Enter track title..." value={newSongTitle} onChange={e => setNewSongTitle(e.target.value)} />
                          <button type="submit" className="btn btn-primary" style={{ padding: '0.6rem 1.1rem', fontSize: '0.85rem' }}>+ Insert BST</button>
                        </form>
                        <form onSubmit={handleSearchSong} style={{ display: 'flex', gap: '0.5rem' }}>
                          <input type="text" className="bst-input" placeholder="Search track in O(log n)..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                          <button type="submit" className="btn btn-secondary" style={{ padding: '0.6rem 1.1rem', fontSize: '0.85rem' }}>🔍 Search</button>
                        </form>
                      </div>
                      {searchResult && (
                        <div style={{ padding: '0.75rem', background: 'rgba(6,182,212,0.1)', border: '1px solid var(--cyan)', borderRadius: 'var(--radius-sm)', marginBottom: '1rem', fontSize: '0.88rem' }}>
                          ⚡ {searchResult}
                        </div>
                      )}
                      <div className="bst-canvas-view">
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1.25rem', justifyContent: 'center' }}>
                          {songs.map((song, i) => (
                            <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', background: 'var(--bg-card)', padding: '0.75rem 1rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-card)' }}>
                              <div className="node-circle">#{i + 1}</div>
                              <div style={{ fontSize: '0.85rem', fontWeight: 700, marginTop: '0.4rem', color: 'var(--text-highlight)' }}>{song.name}</div>
                              <div style={{ fontSize: '0.72rem', color: 'var(--cyan)' }}>{song.artist}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{ marginTop: '1.5rem' }}>
                          <button onClick={handleInOrderTraversal} className="btn btn-outline" style={{ fontSize: '0.82rem', padding: '0.5rem 1rem' }}>▶ Run In-Order Traversal (Alphabetical Sort)</button>
                        </div>
                        {traversalResult && (
                          <div style={{ marginTop: '1rem', fontSize: '0.85rem', color: 'var(--emerald)', fontWeight: 600 }}>Sorted Traversal Output: {traversalResult}</div>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="demo-container-box">
                      <div className="demo-title-bar">
                        <span style={{ fontWeight: 700, color: 'var(--text-highlight)' }}>Campus Notice Engine &bull; Live Broadcast</span>
                        <div style={{ display: 'flex', gap: '0.5rem' }}>
                          {['All', 'Academic', 'Exams', 'Events'].map(c => (
                            <button key={c} className={`tab-btn ${noticeFilter === c ? 'active' : ''}`} style={{ padding: '0.25rem 0.75rem', fontSize: '0.78rem' }} onClick={() => setNoticeFilter(c)}>{c}</button>
                          ))}
                        </div>
                      </div>
                      <form onSubmit={handleAddNotice} style={{ display: 'flex', gap: '0.75rem', marginBottom: '1.25rem' }}>
                        <input type="text" className="bst-input" placeholder="Broadcast new college circular..." value={newNoticeTitle} onChange={e => setNewNoticeTitle(e.target.value)} style={{ flexGrow: 1 }} />
                        <select value={newNoticeCategory} onChange={e => setNewNoticeCategory(e.target.value)} className="bst-input" style={{ width: '130px' }}>
                          <option value="Academic">Academic</option>
                          <option value="Exams">Exams</option>
                          <option value="Events">Events</option>
                        </select>
                        <button type="submit" className="btn btn-primary" style={{ padding: '0.6rem 1.1rem', fontSize: '0.85rem' }}>📡 Broadcast</button>
                      </form>
                      <div className="notice-board-feed">
                        {filteredNotices.map(n => (
                          <div key={n.id} className={`notice-card-item ${n.priority === 'high' ? 'notice-priority-high' : ''}`}>
                            <div className="notice-header-row"><span>🏛️ {n.dept} &bull; [{n.category}]</span><span>🕒 {n.date}</span></div>
                            <div className="notice-title-text">{n.title}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </section>

            {/* CERTIFICATIONS */}
            <section id="certifications" className="cert-section">
              <div className="container">
                <div className="section-header">
                  <span className="section-badge">🏆 Verified Credentials</span>
                  <h2 className="section-title">Certifications & Achievements</h2>
                  <p className="section-subtitle">Industry credentials demonstrating programming capability in C, soft skills, and paper presentation.</p>
                </div>

                <div className="cert-grid">
                  {certificationsData.map((c) => (
                    <div className="glass-card cert-card" key={c.id}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                        <div className="cert-icon-wrap" style={{ borderColor: c.color }}><span>{c.icon}</span></div>
                        <span className="cert-issuer-badge" style={{ backgroundColor: `${c.color}20`, color: c.color }}>✔ {c.badgeText}</span>
                      </div>
                      <div>
                        <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: 600 }}>{c.issuer}</span>
                        <h3 className="cert-title" style={{ marginTop: '0.2rem' }}>{c.title}</h3>
                      </div>
                      <p className="cert-desc">{c.description}</p>
                      <div className="cert-takeaway"><span style={{ fontWeight: 700 }}>Key Competency:</span> {c.keyTakeaway}</div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* EDUCATION */}
            <section id="education" className="education-section">
              <div className="container">
                <div className="section-header">
                  <span className="section-badge">🎓 Academic Background</span>
                  <h2 className="section-title">Education & Milestones</h2>
                </div>
                <div className="glass-card">
                  <div className="edu-timeline-card">
                    <div>
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem', color: 'var(--emerald)', fontSize: '0.85rem', fontWeight: 700, marginBottom: '0.5rem' }}>
                        <span className="pulse-dot"></span><span>{educationData.currentStatus}</span>
                      </div>
                      <h3 style={{ fontSize: '1.75rem', fontWeight: 800, marginBottom: '0.5rem', color: 'var(--text-highlight)' }}>{educationData.degree}</h3>
                      <div style={{ fontSize: '1.15rem', color: 'var(--primary)', fontWeight: 600, marginBottom: '0.25rem' }}>{educationData.institution}</div>
                      <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>📍 {educationData.location} &bull; 🗓️ {educationData.duration}</div>
                    </div>
                    <div>
                      <h4 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '0.8rem', color: 'var(--text-highlight)' }}>Key Coursework</h4>
                      <div className="course-tags-grid">
                        {educationData.courses.map((course, i) => (<span className="course-tag" key={i}>{course}</span>))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* CONTACT */}
            <section id="contact" className="contact-section">
              <div className="container">
                <div className="section-header">
                  <span className="section-badge">📬 Let's Connect</span>
                  <h2 className="section-title">Get In Touch</h2>
                  <p className="section-subtitle">Reach out directly via phone, email, or send a message.</p>
                </div>

                <div className="contact-grid">
                  <div className="contact-info-list">
                    <div className="contact-method-card">
                      <div className="contact-method-icon">📞</div>
                      <div className="contact-method-details">
                        <div className="contact-method-label">Phone Number</div>
                        <div className="contact-method-value">{personalInfo.formattedPhone}</div>
                      </div>
                      <a href={`tel:${personalInfo.phone}`} className="copy-btn-icon" title="Call">📱</a>
                    </div>

                    <div className="contact-method-card">
                      <div className="contact-method-icon">✉️</div>
                      <div className="contact-method-details">
                        <div className="contact-method-label">Email Address</div>
                        <div className="contact-method-value" style={{ fontSize: '0.98rem' }}>{personalInfo.email}</div>
                      </div>
                      <a href={`mailto:${personalInfo.email}`} className="copy-btn-icon" title="Email">✉️</a>
                    </div>

                    <div className="contact-method-card">
                      <div className="contact-method-icon">🏛️</div>
                      <div className="contact-method-details">
                        <div className="contact-method-label">College & Location</div>
                        <div className="contact-method-value" style={{ fontSize: '0.95rem' }}>{personalInfo.college}</div>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{personalInfo.location}</div>
                      </div>
                    </div>
                  </div>

                  <div className="glass-card">
                    <h3 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '1.25rem', color: 'var(--text-highlight)' }}>Send a Direct Message</h3>
                    <form onSubmit={(e) => { e.preventDefault(); showToast("Message sent successfully!"); }} className="contact-form">
                      <div className="form-group">
                        <label className="form-label">Your Name *</label>
                        <input type="text" required className="form-input" placeholder="e.g. Recruiter / Collaborator" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Email Address *</label>
                        <input type="email" required className="form-input" placeholder="name@company.com" />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Message *</label>
                        <textarea required className="form-textarea" placeholder="Hello Subashini..."></textarea>
                      </div>
                      <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>🚀 Send Message</button>
                    </form>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="site-footer">
            <div className="container">
              <div className="footer-content">
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', marginBottom: '0.5rem' }}>
                    <div className="logo-badge" style={{ width: '32px', height: '32px', fontSize: '0.85rem' }}>SM</div>
                    <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>{personalInfo.name}</h3>
                  </div>
                  <p style={{ fontSize: '0.88rem', color: 'var(--text-secondary)' }}>{personalInfo.college} &bull; {personalInfo.degree} ({personalInfo.currentYear})</p>
                </div>
                <div>
                  <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="btn btn-secondary" style={{ padding: '0.6rem 1.1rem', fontSize: '0.85rem' }}>
                    ↑ Back to Top
                  </button>
                </div>
              </div>
              <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '1.5rem', textAlign: 'center', fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                &copy; {new Date().getFullYear()} Subashini M. Built with React.
              </div>
            </div>
          </footer>

          {/* RESUME MODAL */}
          {isResumeOpen && (
            <div className="modal-backdrop" onClick={() => setIsResumeOpen(false)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800 }}>Resume Preview &bull; Subashini M</h3>
                  <div style={{ display: 'flex', gap: '0.6rem' }}>
                    <button onClick={() => window.print()} className="btn btn-primary" style={{ padding: '0.45rem 0.9rem', fontSize: '0.82rem' }}>🖨️ Print / Save PDF</button>
                    <button onClick={() => setIsResumeOpen(false)} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-color)', color: 'var(--text-primary)', width: '32px', height: '32px', borderRadius: '50%', cursor: 'pointer', fontWeight: 'bold' }}>✕</button>
                  </div>
                </div>
                <div className="modal-body">
                  <div className="resume-paper">
                    <h2>SUBASHINI M</h2>
                    <div className="contact-line"><span>{personalInfo.phone}</span> | <span>{personalInfo.email}</span></div>
                    <div className="resume-section-title">CAREER OBJECTIVE</div>
                    <p style={{ fontSize: '0.92rem', lineHeight: 1.6, color: '#334155' }}>{personalInfo.careerObjective}</p>
                    <div className="resume-section-title">EDUCATION</div>
                    <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#0f172a' }}>{educationData.degree}</div>
                    <div style={{ fontSize: '0.9rem', color: '#475569' }}>{educationData.institution}</div>
                    <div style={{ fontSize: '0.85rem', color: '#64748b' }}>Current status: 3rd Year</div>
                    <div className="resume-section-title">TECHNICAL SKILLS</div>
                    <ul style={{ paddingLeft: '1.2rem', fontSize: '0.92rem', color: '#334155' }}>
                      <li><strong>Programming Languages:</strong> Java, Python</li>
                    </ul>
                    <div className="resume-section-title">ACADEMIC PROJECTS</div>
                    <div style={{ marginBottom: '0.8rem' }}>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#0f172a' }}>Music Playlist Organizer Using BST</div>
                      <div style={{ fontSize: '0.9rem', color: '#475569' }}>Academic project focused on organizing a music playlist using a Binary Search Tree (BST).</div>
                    </div>
                    <div style={{ marginBottom: '0.8rem' }}>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#0f172a' }}>Digital Notice Board in Python</div>
                      <div style={{ fontSize: '0.9rem', color: '#475569' }}>Python-based project for a digital notice board.</div>
                    </div>
                    <div className="resume-section-title">CERTIFICATIONS & ACHIEVEMENTS</div>
                    <ul style={{ paddingLeft: '1.2rem', fontSize: '0.92rem', color: '#334155', display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                      <li>• Enhancing Soft Skills and Personality — <strong>NPTEL</strong></li>
                      <li>• Problem Solving in C — <strong>NPTEL</strong></li>
                      <li>• Paper Presentation — <strong>CARE College</strong></li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toastMessage && (
            <aside className="toast-container">
              <div className="toast success"><span>✨</span><span>{toastMessage}</span></div>
            </aside>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
